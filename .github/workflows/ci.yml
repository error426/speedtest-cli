name: CI

on:
  push:
    branches: [master, devel]
  pull_request:
    branches: [master, devel]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install flake8
      - run: flake8 speedtest.py

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - python-version: '3.8'
            os: ubuntu-22.04
          - python-version: '3.9'
            os: ubuntu-22.04
          - python-version: '3.10'
            os: ubuntu-latest
          - python-version: '3.11'
            os: ubuntu-latest
          - python-version: '3.12'
            os: ubuntu-latest
          - python-version: '3.13'
            os: ubuntu-latest
          - python-version: '3.14'
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Verify import
        run: python -c "import speedtest; print(speedtest.__version__)"
      - name: Verify CLI
        run: python speedtest.py --version
      - name: Check for deprecation warnings
        run: python -W error::DeprecationWarning -c "import speedtest"
